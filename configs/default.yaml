# Fleet-Aware CAN-Bus Intrusion Detection — default configuration

project:
  name: fleet-can-ids
  seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  outputs_dir: outputs
  metrics_dir: outputs/metrics
  figures_dir: outputs/figures

# Full pipeline (python experiments/run_full_pipeline.py)
pipeline:
  stop_on_error: true
  skip_if_outputs_exist: false
  steps:
    - load_dataset
    - generate_windows
    - extract_features
    - train_vehicle_ids
    - generate_descriptors
    - build_fleet_graph
    - train_gnn
    - cluster_campaigns
    - final_decision
  artifacts:
    clean_can_data: data/processed/clean_can_data.csv
    window_metadata: data/processed/window_metadata.csv
    window_features: data/processed/window_features.csv
    vehicle_results: outputs/metrics/vehicle_level_results.csv
    vehicle_anomaly_predictions: data/processed/vehicle_anomaly_predictions.csv
    anomaly_descriptors: data/processed/anomaly_descriptors.csv
    fleet_nodes: data/processed/fleet_nodes.csv
    fleet_edges: data/processed/fleet_edges.csv
    fleet_graph: data/processed/fleet_graph.pt
    fleet_graph_graphml: outputs/fleet_graph.graphml
    graph_stats: outputs/metrics/fleet_graph_stats.json
    gcn_embeddings: outputs/embeddings/gcn_node_embeddings.pt
    gnn_checkpoints: outputs/checkpoints
    gnn_metrics: outputs/metrics/gnn_training_metrics.json
    fleet_cluster_results: data/processed/fleet_cluster_results.csv
    final_detection_outcomes: outputs/metrics/final_detection_outcomes.csv
    final_outcome_summary: outputs/metrics/final_outcome_summary.csv
    report: outputs/metrics/pipeline_report.md

data:
  dataset: car_track
  external_dataset_dir: /Users/iyadatieh/Library/CloudStorage/OneDrive-Personal/University of Reading/CodeRepo/Dataset
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

features:
  window_size: 100
  overlap: 50          # overlapping frames; stride = window_size - overlap
  stride: 50           # optional override if overlap is omitted
  generate_plots: true
  # CAN-specific fields to use when available
  use_id: true
  use_payload: true
  use_timestamp: true

vehicle_ids:
  test_size: 0.2
  primary_model: random_forest
  include_autoencoder: true

descriptors:
  test_size: 0.2
  score_threshold: 0.5
  primary_model: random_forest
  regenerate_predictions: false
  include_autoencoder: true

gnn:
  architecture: gcn
  hidden_channels: 64
  embedding_dim: 32
  epochs: 30
  learning_rate: 0.01
  weight_decay: 0.0005
  train_ratio: 0.7
  val_ratio: 0.15
  use_ground_truth_labels: true   # GNN trains on dataset labels, not IDS predictions

graph:
  # Fleet anomaly graph: nodes = descriptors, edges = behavioural similarity only
  similarity_metric: cosine      # cosine | euclidean
  similarity_threshold: 0.85      # edge if similarity >= threshold
  max_nodes: null                 # optional subsample for fast experiments
  max_neighbors: 50               # full-node bounded kNN before thresholding; prevents OOM

clustering:
  kmeans_clusters: 12
  dbscan_eps: 1.2
  dbscan_min_samples: 10
  dbscan_pca_components: 8
  max_clustering_samples: 20000
  similarity_threshold: 0.85   # suspicious if intra-cluster mean cosine sim >= this
  min_vehicles: 2                # suspicious if cluster spans >= N vehicle models

final_decision:
  similarity_threshold: 0.85
  min_vehicles: 2

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - auc

experiment:
  name: baseline
  tags: []

research:
  report_path: outputs/experiment_report.md
  graph_viz_max_nodes: 800
  autoencoder_epochs_report: 15   # lighter AE when generating ROC for the report
